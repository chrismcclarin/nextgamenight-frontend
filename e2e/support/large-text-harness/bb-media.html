<!--
  The bb-media building block (a picture stand-in beside words; the words go under the picture
  before a word breaks, and the picture is dropped by its own container variant when the card is
  too narrow for picture, gap and words) in its four content cases.
  The first picture is 4rem and drops under 15rem; the second is 3rem and drops under 14rem.
  The picture rows carry no data-room mark: the words sit in a paragraph inside the words box, and
  the split read finds the picture row above that paragraph by itself (orchestrator fix R3).
  One section per content case, marked with data-case; the matrix spec renders ONE section at a time.
  The wrappers carry lt- hook names the app never styles, so nothing here collides with a shipped rule.
  The frame and the card carry the thin edges at their phone values at every width (16px page edge,
  12px card edge), with no desktop variant, so both 200% modes lay out alike.
  Every state is static markup: this file holds no script and no outside address.
-->

<section data-case="ordinary">
  <main data-frame class="lt-frame px-edge-page py-4">
    <div data-card class="lt-card rounded-card border border-line bg-surface-card p-edge-card">
      <div class="bb-media">
        <div class="bb-media-row">
          <div aria-hidden="true" class="w-16 h-16 rounded-sm bg-surface-sunken @max-[15rem]:hidden"></div>
          <div class="bb-media-text">
            <p class="font-semibold text-base text-content-primary">Ticket to Ride</p>
            <p class="text-sm text-content-secondary">Played 3 times, last on 12 Nov</p>
          </div>
        </div>
      </div>
      <div class="bb-media mt-3">
        <div class="bb-media-row">
          <div aria-hidden="true" class="w-12 h-12 rounded-sm bg-surface-sunken @max-[14rem]:hidden"></div>
          <div class="bb-media-text">
            <p class="font-semibold text-base text-content-primary">Azul</p>
            <p class="text-sm text-content-secondary">Played once</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</section>
