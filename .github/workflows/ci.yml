# CI pipeline for the Nextgamenight FRONTEND repo (chrismcclarin/nextgamenight-frontend).
#
# This workflow lives in the FE repo, so the checkout root IS the Next.js app —
# there is NO `periodictabletop/` subdir and NO `working-directory: periodictabletop`.
# The e2e job CROSS-REPO checks out the backend (chrismcclarin/nextgamenight-backend),
# whose app lives at `backend/Sonnet/`.
#
# Two jobs (D-01/D-02):
#   quality  — fast gate: lint + tsc --noEmit + born-.tsx git-diff block + vitest run
#   e2e      — slow gate (needs: quality): real backend + Postgres + Playwright journeys
name: CI

on:
  pull_request:
    branches: [main] # the FE repo's default branch (NOT the docs-root `master`)
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      backend-ref:
        description: "Backend branch/ref for the e2e job's cross-repo checkout (pre-merge backend PRs point this at their feature branch)"
        required: false
        default: "main"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-diff base comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so the born-.tsx git-diff can reach the PR base sha

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (hard tsc gate — not relying on `next build` alone)
        run: npm run typecheck # tsc --noEmit; checkJs:false keeps it sub-second

      - name: Unit tests
        run: npx vitest run

      - name: Born-.tsx enforcement (fail on any NEW app-source .js/.jsx under src/)
        # D-08: a NEW app-source file must be .ts/.tsx. Scoped to ADDED files only
        # (--diff-filter=A) under the FE-repo-relative `src/` tree. Existing .js,
        # config files, and e2e/ are unaffected. Only runs on pull_request (needs a base).
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          NEW_JS=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD \
            | grep -E '^src/.*\.(js|jsx)$' || true)
          if [ -n "$NEW_JS" ]; then
            echo "::error::New app-source .js/.jsx files added under src/ — new files must be .ts/.tsx (TS-01 / D-08):"
            echo "$NEW_JS"
            exit 1
          fi
          echo "No newly-added src/ .js(x) files — born-.tsx enforcement passed."

      - name: "Grep gate — no user.sub compared against an API data field (Req 3 / BINT-02)"
        # Phase 87.3 anti-regression backstop. The Auth0 `user.sub` is NOT a
        # `Users.id` UUID; comparing it against an API-supplied identity field
        # (`m.user_id`, `review.User?.id`, an rsvp `.User.id`, …) is the is-me
        # bug class this phase converged away. This gate makes that compare class
        # permanently un-shippable in `src/app`.
        #
        # SYMMETRIC to operand order and equality flavor: matches strict AND
        # loose equality (`===`, `==`, `!==`, `!=`) with the sub on either side,
        # membership idioms (`.find(...user.sub)`, `.filter(`, `.includes(`,
        # `.has(`, `.some(`), and object bracket-lookups keyed by the sub
        # (`rolesById[user.sub]` — an identifier char must precede `[`, so
        # dependency arrays like `}, [user.sub])` stay allowlisted).
        # ALLOWLISTED by construction (no compare/membership context adjacent
        # to `.sub`): self-fetch calls `getUser(user.sub)`, presence guards
        # `if (!user?.sub)`, and API args `getUserGroups(user.sub)`.
        #
        # Inverted-grep idiom (Pitfall 2): grep exits nonzero on NO MATCH, so
        # capture with `|| true`, filter full-line comments (which may quote the
        # old pattern in explanatory prose), and `exit 1` only when HITS is
        # non-empty. The comment filter is ANCHORED to the content start after
        # grep's `path:line:` prefix so a genuine hit on a line containing `://`
        # (e.g. a URL in a string) is never dropped. The lockstep self-test
        # `src/lib/ci-grep-gate.fixture.test.ts` (run by vitest) parses BOTH the
        # pattern and the filter out of THIS file — edits here are exercised
        # there automatically.
        #
        # Phase 88.2 (plan 09, MED #8): the self-test used to find this gate
        # POSITIONALLY — the first grep-gate line in the whole file — which made
        # step ORDER load-bearing in a way nothing declared. Adding a second gate
        # above this one would have silently repointed the self-test at the new
        # gate and left THIS one completely unverified while everything stayed
        # green. It now locates each gate by its step NAME, so order no longer
        # matters. Do NOT revert it to a positional lookup, and do not rename this
        # step without updating the name string in that test (it throws loudly if
        # the name is missing). The literal shell assignment below is deliberately
        # not spelled out anywhere in this comment block: the parser scans for it,
        # and a comment naming it would be found first and fail to parse.
        run: |
          HITS=$(grep -rnE '([!=]=[=]?[[:space:]]*user\??\.sub)|(user\??\.sub[[:space:]]*[!=]=)|\.(find|filter|includes|has|some)\([^)]*user\??\.sub|[A-Za-z0-9_$]\[[[:space:]]*user\??\.sub[[:space:]]*\]' src/app | grep -vE '^[^:]*:[0-9]+:[[:space:]]*//' || true)
          if [ -n "$HITS" ]; then
            echo "::error::user.sub compared against an API data field in src/app — the sub is not a Users.id UUID; compare the resolved self UUID (useSelfIdentity's selfUuid) against the nested User.id instead (Req 3 / BINT-02):"
            echo "$HITS"
            exit 1
          fi
          echo "No-sub-compare gate passed — no user.sub vs API-field is-me compares in src/app."

      - name: "Grep gate — group-delete copy must not claim permanence (88.2 / SPEC-REQ-7)"
        # Phase 88.2 anti-regression backstop. Deleting a group is a SOFT delete
        # with a 30-day recovery window: every remaining member is emailed a link
        # to take the group over, and only after the window closes is anything
        # erased. Copy in the group-delete flow claiming the action is final is
        # therefore factually WRONG, and wrong in the dangerous direction — it
        # talks an owner out of a reversible action, or tells them the emailed
        # offer their members just received cannot exist.
        #
        # SCOPED DELIBERATELY to the group-delete flow, NOT to src/. The same
        # phrases appear seven more times across account deletion
        # (DangerZoneDeleteAccount.tsx, goodbye/page.tsx), a Modal test fixture,
        # role promotion (ManageMembers.js) and event delete (gameDetail/page.js).
        # Every one of those is correct as it stands — account deletion really is
        # final. Widening this scope to src/ would red the build forever and the
        # gate would end up deleted rather than obeyed. Plan 10's restore page has
        # now landed and is the second entry. If another surface needs covering,
        # add another explicit FILE path; do not replace the list with a broad
        # prefix.
        #
        # The scope is a list of FILES, never a DIRECTORY, and that is load-bearing
        # rather than stylistic. Each of these surfaces ships alongside a test file
        # that necessarily NAMES the phrases it asserts are absent — a test for the
        # absence of a string has to spell the string. Those literals sit on
        # ordinary code lines, not comment lines, so the filter below does not
        # exclude them; a directory scope would sweep the test in, match its own
        # fixture data, and red the build on a correct tree with no way to fix it
        # short of deleting the assertion. File paths keep the gate pointed at the
        # rendered copy only.
        #
        # Same inverted-grep idiom as the gate above (Pitfall 2): grep exits
        # nonzero on NO MATCH, so capture with `|| true`, filter full-line comments
        # (so a future comment quoting the retired copy cannot self-red the gate),
        # and `exit 1` only when HITS is non-empty. The lockstep self-test
        # `src/lib/ci-grep-gate.fixture.test.ts` parses this step's pattern, flags,
        # scope and filter out of THIS file, located by the step name above.
        run: |
          # L-12: a renamed or deleted scoped file makes grep exit 2, which the
          # `|| true` below swallows — the gate would "pass" while scanning fewer
          # files. Mirror the BE purge-gate's existence guard: a missing scope
          # entry is a loud failure, never a silent shrink.
          for f in src/app/components/GroupSettings.js 'src/app/restore/group/[token]/page.tsx'; do
            if [ ! -f "$f" ]; then
              echo "::error::Permanence-gate scoped file missing: $f — renamed or deleted; update the gate's scope list (and its fixture self-test) instead of letting the gate shrink silently."
              exit 1
            fi
          done
          HITS=$(grep -rniE 'cannot be undone|permanently remove|permanently delete' src/app/components/GroupSettings.js 'src/app/restore/group/[token]/page.tsx' | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|\{/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Group-delete copy claims permanence, which is false as of Phase 88.2 — the group delete is recoverable for 30 days and members are emailed a link to take the group over. Scope: the group Danger Zone and the emailed restore page. Fix the copy; do not widen the gate:"
            echo "$HITS"
            exit 1
          fi
          echo "Permanence-copy gate passed — the group-delete flow makes no permanence claim."

  e2e:
    name: e2e
    needs: quality # D-02: e2e only runs after the fast quality gate is green
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a healthy run is ~10 min; a hung step burned an hour once (run 27309008729)

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: boardgame_db
        ports:
          - 5432:5432
        # Health-gate the container so DB steps never race the server coming up.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DB connection — both forms, so create-database.js (DB_* vars) and
      # the sequelize-cli migrate path + runtime (DATABASE_URL) agree on the
      # same Postgres service container.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: boardgame_db
      DATABASE_URL: postgres://postgres:password@localhost:5432/boardgame_db
      # Backend boot env (minimal — optional integrations degrade gracefully, Pitfall 5).
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      FRONTEND_URL: http://localhost:3000
      # Signs availability magic JWTs + RSVP HMAC links (services/magicTokenService,
      # routes/rsvp.js). Throwaway CI-only value — must merely AGREE between the
      # fixture-minting step and the booted server, so plaintext is fine.
      MAGIC_TOKEN_SECRET: e2e-ci-throwaway-magic-token-secret-1f2e3d4c5b6a

    steps:
      - name: Checkout frontend (nextgamenight-frontend — repo root = FE app)
        uses: actions/checkout@v4

      - name: "Checkout backend (cross-repo: nextgamenight-backend)"
        uses: actions/checkout@v4
        with:
          repository: chrismcclarin/nextgamenight-backend
          path: backend # BE app then lives at backend/Sonnet/
          # workflow_dispatch can point the e2e job at a pre-merge backend branch
          # (phase 87.1 review HIGH-2); PR/push runs keep checking out main.
          ref: ${{ github.event.inputs.backend-ref || 'main' }}
          # nextgamenight-backend is PUBLIC (verified 2026-05-30) — no token needed;
          # actions/checkout reads public repos with the default GITHUB_TOKEN.

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/Sonnet/package-lock.json

      # ---- Backend: install, provision DB from the models, boot ----
      - name: Backend — install
        working-directory: backend/Sonnet
        run: npm ci

      - name: Backend — create database
        working-directory: backend/Sonnet
        run: npm run db:create

      # NO migrate step: the repo's migrations evolve the pre-existing prod
      # schema and cannot run from an empty DB (the earliest one assumes the
      # "Users" table already exists — proven by CI run 27304799255). Schema
      # comes from the models instead: the seed script runs
      # sequelize.sync({ alter: true }) and server boot syncs again (force:false).
      - name: Backend — seed (sync({alter:true}) builds the schema from models; seed data belongs to the E2E login identity)
        working-directory: backend/Sonnet
        env:
          AUTH0_ALICE_SUB: ${{ secrets.AUTH0_ALICE_SUB }} # the test user's `sub`
        run: npm run seed

      - name: Backend — mint E2E fixtures (journey tokens + ids -> GITHUB_ENV)
        working-directory: backend/Sonnet
        timeout-minutes: 5
        env:
          AUTH0_ALICE_SUB: ${{ secrets.AUTH0_ALICE_SUB }}
        run: |
          # Sequelize logs SQL to stdout — fish out the single marker line.
          # Output goes to a file (NOT the log) so tokens never print (T-82-11).
          node scripts/e2e-fixtures.js > /tmp/e2e-fixtures.out 2>&1 || { tail -40 /tmp/e2e-fixtures.out; exit 1; }
          JSON=$(grep -m1 '^E2E_FIXTURES_JSON=' /tmp/e2e-fixtures.out | sed 's/^E2E_FIXTURES_JSON=//')
          [ -n "$JSON" ] || { echo "::error::e2e-fixtures emitted no marker line"; tail -40 /tmp/e2e-fixtures.out; exit 1; }
          {
            echo "E2E_GROUP_ID=$(echo "$JSON" | jq -r .group_id)"
            echo "E2E_AVAILABILITY_TOKEN=$(echo "$JSON" | jq -r .availability_token)"
            echo "E2E_RSVP_PATH=$(echo "$JSON" | jq -r .rsvp_path)"
            echo "E2E_INVITE_GROUP_NAME=$(echo "$JSON" | jq -r .invite_group_name)"
            echo "E2E_INVITE_FRIEND_NAME=$(echo "$JSON" | jq -r .invite_friend_name)"
            # Phase 87.8 plan 09 (D-08 prep, ML-18/ML-22): the three keys plan 02 added are
            # extracted with `jq -e`, which exits non-zero when a key is absent or null. Bare
            # `jq -r` would emit the LITERAL STRING "null" — truthy and non-empty, so it
            # satisfies the specs' `?? fallback` idiom exactly when the guard is needed and
            # silently drives a spec to /null instead of failing this step loudly. Error
            # lines go to stderr (>&2): stdout inside this brace group is redirected into
            # GITHUB_ENV, not the job log. This guard doubles as the PRE-ARM GATE assertion —
            # see the decision block above the Playwright run step below.
            E2E_INVITE_FRIEND_NAME_PHONE=$(echo "$JSON" | jq -e -r '.invite_friend_name_phone') \
              || { echo "::error::fixture key invite_friend_name_phone missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            E2E_RSVP_PATH_PHONE=$(echo "$JSON" | jq -e -r '.rsvp_path_phone') \
              || { echo "::error::fixture key rsvp_path_phone missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            E2E_RESTORE_PATH=$(echo "$JSON" | jq -e -r '.restore_path') \
              || { echo "::error::fixture key restore_path missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            E2E_EVENT_DETAIL_PATH=$(echo "$JSON" | jq -e -r '.event_detail_path') \
              || { echo "::error::fixture key event_detail_path missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            echo "E2E_INVITE_FRIEND_NAME_PHONE=$E2E_INVITE_FRIEND_NAME_PHONE"
            echo "E2E_RSVP_PATH_PHONE=$E2E_RSVP_PATH_PHONE"
            echo "E2E_RESTORE_PATH=$E2E_RESTORE_PATH"
            echo "E2E_EVENT_DETAIL_PATH=$E2E_EVENT_DETAIL_PATH"
          } >> "$GITHUB_ENV"
          echo "Fixtures minted (group id, availability token, rsvp path + phone rsvp path, invite group + friend, phone invite friend, restore path, event detail path)."

      - name: Backend — boot (server.js, :4000) and smoke-wait /health
        working-directory: backend/Sonnet
        run: |
          npm start &
          npx --yes wait-on http://localhost:4000/health --timeout 60000

      # ---- Frontend: install, production build + start, then Playwright ----
      - name: Frontend — install
        run: npm ci

      - name: Frontend — production build (proves the green build, SC#1 / Open Q3)
        run: npm run build

      - name: Frontend — start (next start, :3000) and wait
        env:
          # Full @auth0/nextjs-auth0 server env — the Playwright setup project
          # drives the real /api/auth/login route, so the Next server must be
          # able to complete the Auth0 code exchange (T-82-11: secrets cross
          # only via env, never echoed).
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }} # cookie-encryption key, CI-only random value
          AUTH0_BASE_URL: http://localhost:3000
          AUTH0_ISSUER_BASE_URL: https://${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # DECISION Phase 87.7 D-13/D-15: the PR lane is pinned with `--project`, chosen OVER a
      # separate report-only / continue-on-error mobile job. The rejected pattern is the exact
      # one Phase 88.4 structurally BANNED in the backend repo (`verify-gate-armed.js` fails CI
      # on that key) — it must not be reintroduced in this repo in any future wiring, INCLUDING
      # by Phase 87.8 when it arms the phone project. A gate that cannot fail is not a gate.
      #
      # `--project` is a positive ALLOWLIST and that is the load-bearing property: adding a
      # project to playwright.config.ts can never silently opt it into the PR lane. The `phone`
      # project (MOB-03) therefore exists in config but does not run here yet.
      #
      # DECISION Phase 87.8 plan 09 (ML-26): this plan wires the phone fixture keys (the
      # guarded `jq -e` extraction in the fixture step above) and the pre-arm gate below, and
      # deliberately does NOT arm the lane — arming before the combined-run evidence exists
      # would fail PRs for a reason unrelated to mobile. Plan 12 ALONE performs the arming
      # edit (appending the phone project to the run line below), immediately after its green
      # combined run and negative control. The D-13 accepted window — the phone surface
      # unwatched on PRs — is still OPEN until plan 12 lands that edit; this plan is the last
      # preparatory step before it closes.
      #
      # PRE-ARM GATE (plan 09, ML-20/ML-23) — plan 12 MUST NOT arm until this is green:
      # dispatch THIS workflow (workflow_dispatch, from a ref carrying the guarded `jq -e`
      # extraction above) with `backend-ref` pointing at the backend commit that put plan 02's
      # fixture keys on backend main. The guarded extraction hard-fails the fixture step on
      # any missing/null key, so a green fixture step in that dispatched run IS the mechanical
      # proof that the CI backend checkout emits every key non-null — replacing the
      # prose-only merge-order promise. Same workflow_dispatch backend-ref pattern as Phase
      # 87.1 (run 28946718108), reused in 87.3.
      #
      # ML-16 OWNER RULING (severity LOW, 2026-08-02, 87.8-PLAN-REVIEW.md): plan 12's
      # deliberately-red negative control uploads Playwright traces carrying fixture URLs and
      # the encrypted appSession cookie — a trace is a different container from the `.auth/`
      # exclusion in the artifact step below. Accepted CONDITIONAL on three invariants; if
      # ANY flips, this returns to at least MEDIUM and must be re-ruled, not inherited:
      # (1) MAGIC_TOKEN_SECRET stays a published throwaway paired with an ephemeral CI
      # database; (2) AUTH0_SECRET stays CI-only and un-reused anywhere durable;
      # (3) FRONTEND_URL stays localhost in CI.
      #
      # Also deliberately NOT done (D-19): no workflow_dispatch input for project selection. A
      # permanent input defaulting to the pinned set is a config surface that can silently
      # disarm this pinning — the same failure class Phase 88.4 spent a plan closing. The one
      # exploratory all-projects run uses a throwaway branch instead. FULL MECHANISM — the
      # push alone is NOT enough: the `push: branches-ignore: [main]` trigger above picks the
      # branch up, but this pinned `--project` list applies to EVERY trigger, so the throwaway
      # branch must ALSO edit the run line below (append a project, or drop the pin entirely
      # for all-projects). Both edits die with the branch; nothing permanent changes.
      #
      # ARMED Phase 87.8 plan 12 step (c): `--project=phone` joined the pinned set AFTER the
      # required evidence pair — green combined run 30844453508 (44 passed, 0 failed) and
      # negative control 30844455459 (red on exactly the five planted padding assertions).
      # Removing `--project=phone` from the run line DISARMS the phone-forward gate (MOB-03) —
      # that is a decision, not a cleanup.
      - name: Run Playwright journeys (setup logs in once; all specs in the journeys project reuse storageState)
        env:
          # Auth credentials cross into the runner ONLY via env — never echoed (T-82-11).
          E2E_AUTH0_USER: ${{ secrets.E2E_AUTH0_USER }}
          E2E_AUTH0_PASS: ${{ secrets.E2E_AUTH0_PASS }}
        run: npx playwright test --project=setup --project=journeys --project=phone

      - name: Upload Playwright failure evidence (excludes .auth/ — T-82-12)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The CI reporter is 'github' (no playwright-report/ dir) — failure
          # evidence (screenshots, traces, error-context.md) lands in
          # test-results/. NOT .auth/ — never upload the appSession storageState.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
