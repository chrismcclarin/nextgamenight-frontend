# CI pipeline for the Nextgamenight FRONTEND repo (chrismcclarin/nextgamenight-frontend).
#
# This workflow lives in the FE repo, so the checkout root IS the Next.js app —
# there is NO `periodictabletop/` subdir and NO `working-directory: periodictabletop`.
# The e2e job CROSS-REPO checks out the backend (chrismcclarin/nextgamenight-backend),
# whose app lives at `backend/Sonnet/`.
#
# Three jobs (D-01/D-02 + the 88-32 ruling-5 gate):
#   quality             — fast gate: lint + tsc --noEmit + born-.tsx git-diff block + vitest run
#   drift-gate-registry — Phase 88 guard registry, its own job SO IT CAN BE A REQUIRED CHECK
#   e2e                 — slow gate (needs: quality): real backend + Postgres + Playwright journeys
name: CI

on:
  pull_request:
    branches: [main] # the FE repo's default branch (NOT the docs-root `master`)
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      backend-ref:
        description: "Backend branch/ref for the e2e job's cross-repo checkout (pre-merge backend PRs point this at their feature branch)"
        required: false
        default: "main"

# CodeQL `actions/missing-workflow-permissions` (first scan, 2026-09-08) flagged all three
# jobs: with no `permissions:` key, every job got the default token, which on a
# pull_request/push from this repo is far wider than anything here needs. Least privilege.
#
# `contents: read` is the whole requirement, verified against the file rather than assumed.
# Anchored to STEP NAMES, not line numbers, on purpose — a line cite inside the file it
# describes is wrong the next time anything above it is edited. The complete set of actions
# is `actions/checkout@v4` x4 (quality's "Checkout (full history ...)", drift-gate-registry's
# "Checkout", and e2e's "Checkout frontend" + "Checkout backend"), `actions/setup-node@v4` x3
# ("Setup Node 20" in quality, drift-gate-registry and e2e) and two `actions/upload-artifact@v4` ("Upload
# Playwright failure evidence (age ciphertext only — never .auth/ — T-82-12)" and "Upload desktop
# month-tile screenshots (always — age ciphertext only, never .auth/ — T-82-12)").
# AMENDED 2026-10-24 (Phase 88.6.2 plan 27, T-88.6-G34): both uploads now ship only
# enc/<artifact>/ — age ciphertext written by the run-only steps "Encrypt Playwright failure
# evidence" and "Encrypt desktop month-tile screenshots" (scripts/encrypt-evidence.sh, recipient
# .github/evidence-recipient.txt); they use no action and no token; age comes from the Ubuntu
# archive through the run-only step "Install age (evidence encryption — T-88.6-G34)" — so the
# scope is unchanged. AMENDED 2026-09-28 (Phase 88.6 plan 55, gap-lap ML-17): this
# census said "one" until the second upload landed in the same commit; neither reaches
# `.auth/` (the failure step uploads `playwright-report/` + `test-results/`, the new one only
# `test-results/**/month-tile-desktop-*.png`), both authenticate with ACTIONS_RUNTIME_TOKEN,
# AMENDED 2026-09-29 (Phase 88.6 CR-01): the failure step now EXCLUDES `**/*.zip` under both
# directories, so no Playwright trace archive is uploaded; the scope and token are unchanged,
# and neither adds a scope. There is no `gh`, no `github-script`, no `api.github.com`
# call, and no step that WRITES to GitHub — no PR comment, no commit status, no release, no
# package push. "Checkout backend" reads chrismcclarin/nextgamenight-backend, which is PUBLIC,
# so `contents: read` on the default token covers it (see that step's own GITHUB_TOKEN note).
# setup-node's cache and upload-artifact@v4 authenticate with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so neither is governed by this key; `actions: read` would only be needed to
# DOWNLOAD artifacts from another workflow run, which nothing here does.
#
# Top-level rather than three per-job blocks, deliberately: it makes the floor apply to any
# job added later instead of silently granting the new job the wide default. If a future step
# genuinely needs to write, add the ONE extra scope to THAT job (a job-level `permissions:`
# fully overrides this one — it does not merge), never by widening this block.
# Do not delete this block to "clean up" — it is the fix for the CodeQL finding.
permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-diff base comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so the born-.tsx git-diff can reach the PR base sha

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (hard tsc gate — not relying on `next build` alone)
        run: npm run typecheck # tsc --noEmit; checkJs:false keeps it sub-second

      # DEF-88-30-02. `tsconfig.json` excludes `e2e/`, so the step above is structurally
      # incapable of failing on a Playwright spec — three `verify` blocks in plan 88-30 alone
      # were written as if it did. Probed both ways: a planted TS2322 in
      # `e2e/route-fallbacks.spec.ts` exits 0 under the app config and exits 2 under this one.
      #
      # It runs in `quality`, not `e2e`, on purpose: it needs no build, no browsers, no
      # database and no secrets, so it is the cheapest possible place to catch a broken spec —
      # and catching it here means a spec that cannot compile fails in ~10s instead of after
      # the e2e job has spent ten minutes standing up a backend to run it.
      - name: Typecheck e2e specs (DEF-88-30-02 — tsconfig.json excludes e2e/)
        run: npx tsc --noEmit -p tsconfig.e2e.json

      - name: Unit tests
        run: npx vitest run

      - name: Born-.tsx enforcement (fail on any NEW app-source .js/.jsx under src/)
        # D-08: a NEW app-source file must be .ts/.tsx. Scoped to ADDED files only
        # (--diff-filter=A) under the FE-repo-relative `src/` tree. Existing .js,
        # config files, and e2e/ are unaffected. Only runs on pull_request (needs a base).
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          NEW_JS=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD \
            | grep -E '^src/.*\.(js|jsx)$' || true)
          if [ -n "$NEW_JS" ]; then
            echo "::error::New app-source .js/.jsx files added under src/ — new files must be .ts/.tsx (TS-01 / D-08):"
            echo "$NEW_JS"
            exit 1
          fi
          echo "No newly-added src/ .js(x) files — born-.tsx enforcement passed."

      - name: "Grep gate — no user.sub compared against an API data field (Req 3 / BINT-02)"
        # Phase 87.3 anti-regression backstop. The Auth0 `user.sub` is NOT a
        # `Users.id` UUID; comparing it against an API-supplied identity field
        # (`m.user_id`, `review.User?.id`, an rsvp `.User.id`, …) is the is-me
        # bug class this phase converged away. This gate makes that compare class
        # permanently un-shippable in `src/app`.
        #
        # SYMMETRIC to operand order and equality flavor: matches strict AND
        # loose equality (`===`, `==`, `!==`, `!=`) with the sub on either side,
        # membership idioms (`.find(...user.sub)`, `.filter(`, `.includes(`,
        # `.has(`, `.some(`), and object bracket-lookups keyed by the sub
        # (`rolesById[user.sub]` — an identifier char must precede `[`, so
        # dependency arrays like `}, [user.sub])` stay allowlisted).
        # ALLOWLISTED by construction (no compare/membership context adjacent
        # to `.sub`): self-fetch calls `getUser(user.sub)`, presence guards
        # `if (!user?.sub)`, and API args `getUserGroups(user.sub)`.
        #
        # Inverted-grep idiom (Pitfall 2): grep exits nonzero on NO MATCH, so
        # capture with `|| true`, filter full-line comments (which may quote the
        # old pattern in explanatory prose), and `exit 1` only when HITS is
        # non-empty. The comment filter is ANCHORED to the content start after
        # grep's `path:line:` prefix so a genuine hit on a line containing `://`
        # (e.g. a URL in a string) is never dropped. The lockstep self-test
        # `src/lib/ci-grep-gate.fixture.test.ts` (run by vitest) parses BOTH the
        # pattern and the filter out of THIS file — edits here are exercised
        # there automatically.
        #
        # Phase 88.2 (plan 09, MED #8): the self-test used to find this gate
        # POSITIONALLY — the first grep-gate line in the whole file — which made
        # step ORDER load-bearing in a way nothing declared. Adding a second gate
        # above this one would have silently repointed the self-test at the new
        # gate and left THIS one completely unverified while everything stayed
        # green. It now locates each gate by its step NAME, so order no longer
        # matters. Do NOT revert it to a positional lookup, and do not rename this
        # step without updating the name string in that test (it throws loudly if
        # the name is missing). The literal shell assignment below is deliberately
        # not spelled out anywhere in this comment block: the parser scans for it,
        # and a comment naming it would be found first and fail to parse.
        run: |
          HITS=$(grep -rnE '([!=]=[=]?[[:space:]]*user\??\.sub)|(user\??\.sub[[:space:]]*[!=]=)|\.(find|filter|includes|has|some)\([^)]*user\??\.sub|[A-Za-z0-9_$]\[[[:space:]]*user\??\.sub[[:space:]]*\]' src/app | grep -vE '^[^:]*:[0-9]+:[[:space:]]*//' || true)
          if [ -n "$HITS" ]; then
            echo "::error::user.sub compared against an API data field in src/app — the sub is not a Users.id UUID; compare the resolved self UUID (useSelfIdentity's selfUuid) against the nested User.id instead (Req 3 / BINT-02):"
            echo "$HITS"
            exit 1
          fi
          echo "No-sub-compare gate passed — no user.sub vs API-field is-me compares in src/app."

      - name: "Grep gate — group-delete copy must not claim permanence (88.2 / SPEC-REQ-7)"
        # Phase 88.2 anti-regression backstop. Deleting a group is a SOFT delete
        # with a 30-day recovery window: every remaining member is emailed a link
        # to take the group over, and only after the window closes is anything
        # erased. Copy in the group-delete flow claiming the action is final is
        # therefore factually WRONG, and wrong in the dangerous direction — it
        # talks an owner out of a reversible action, or tells them the emailed
        # offer their members just received cannot exist.
        #
        # SCOPED DELIBERATELY to the group-delete flow, NOT to src/. The same
        # phrases appear seven more times across account deletion
        # (DangerZoneDeleteAccount.tsx, goodbye/page.tsx), a Modal test fixture,
        # role promotion (ManageMembers.js) and event delete (gameDetail/page.js).
        # Every one of those is correct as it stands — account deletion really is
        # final. Widening this scope to src/ would red the build forever and the
        # gate would end up deleted rather than obeyed. Plan 10's restore page has
        # now landed and is the second entry. If another surface needs covering,
        # add another explicit FILE path; do not replace the list with a broad
        # prefix.
        #
        # The scope is a list of FILES, never a DIRECTORY, and that is load-bearing
        # rather than stylistic. Each of these surfaces ships alongside a test file
        # that necessarily NAMES the phrases it asserts are absent — a test for the
        # absence of a string has to spell the string. Those literals sit on
        # ordinary code lines, not comment lines, so the filter below does not
        # exclude them; a directory scope would sweep the test in, match its own
        # fixture data, and red the build on a correct tree with no way to fix it
        # short of deleting the assertion. File paths keep the gate pointed at the
        # rendered copy only.
        #
        # Same inverted-grep idiom as the gate above (Pitfall 2): grep exits
        # nonzero on NO MATCH, so capture with `|| true`, filter full-line comments
        # (so a future comment quoting the retired copy cannot self-red the gate),
        # and `exit 1` only when HITS is non-empty. The lockstep self-test
        # `src/lib/ci-grep-gate.fixture.test.ts` parses this step's pattern, flags,
        # scope and filter out of THIS file, located by the step name above.
        run: |
          # L-12: a renamed or deleted scoped file makes grep exit 2, which the
          # `|| true` below swallows — the gate would "pass" while scanning fewer
          # files. Mirror the BE purge-gate's existence guard: a missing scope
          # entry is a loud failure, never a silent shrink.
          for f in src/app/components/GroupSettings.js 'src/app/restore/group/[token]/page.tsx'; do
            if [ ! -f "$f" ]; then
              echo "::error::Permanence-gate scoped file missing: $f — renamed or deleted; update the gate's scope list (and its fixture self-test) instead of letting the gate shrink silently."
              exit 1
            fi
          done
          HITS=$(grep -rniE 'cannot be undone|permanently remove|permanently delete' src/app/components/GroupSettings.js 'src/app/restore/group/[token]/page.tsx' | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|\{/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Group-delete copy claims permanence, which is false as of Phase 88.2 — the group delete is recoverable for 30 days and members are emailed a link to take the group over. Scope: the group Danger Zone and the emailed restore page. Fix the copy; do not widen the gate:"
            echo "$HITS"
            exit 1
          fi
          echo "Permanence-copy gate passed — the group-delete flow makes no permanence claim."

      - name: "Phase 88.6.2 proofs (phase PR only) - comment-only diff, anchor cites, cite ratchet, no retry bump"
        # DECISION Phase 88.6.2-07 (D-22): a phase-branch-gated step inside quality OVER a required check of
        # its own. The comment-only proof (SPEC R11) fails by design on every behaviour PR, so the step runs
        # only on this phase's pull request; on every other PR it is skipped and quality is unchanged. The
        # prefix keeps the hyphen that ends feat/phase-<number>- (the branch execute-phase creates), so a
        # later phase numbered 88.6.20 or above never matches.
        # DECISION Phase 88.6.2-07 (placement): the LAST step of quality, behind a pristine-tree guard, OVER
        # the first step after npm ci. Lint and both typechecks were measured to leave the checkout pristine
        # and no unit test writes into it, so running last costs nothing and every earlier result still
        # reports on the phase PR. If an earlier step ever writes a tracked or unignored file, the guard
        # fails loudly instead of letting the comment-only proof judge a modified tree.
        # Fail closed: bash with set -euo pipefail, no pipes, no continue-on-error; each proof exits non-zero
        # on any failure, and each self-test runs before its real run so a broken checker never vouches for
        # the tree. BASE_SHA comes in through env and the branch name is read only by the if, so no event
        # text is pasted into the script. The ratchet test itself also runs in Unit tests on every PR. The P2 test names --test-reporter=tap on purpose: Node 24 prints the spec reporter by default.
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/phase-88.6.2-')
        shell: bash
        timeout-minutes: 10
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then echo "::error::BASE_SHA is empty, so the phase proofs have no pull request base to compare against"; exit 1; fi
          DIRTY=$(git status --porcelain --untracked-files=all)
          if [ -n "$DIRTY" ]; then
            echo "::error::the checkout is not pristine: an earlier step wrote these files, so the comment-only proof would judge a modified tree. Move this step above the step that wrote them."
            echo "$DIRTY"
            exit 1
          fi
          node scripts/comment-only-diff.mjs --self-test
          node scripts/comment-only-diff.mjs "$BASE_SHA"
          node scripts/anchor-cite-check.mjs --self-test
          node scripts/anchor-cite-check.mjs
          node scripts/line-cite-census.mjs --self-test
          node scripts/line-cite-census.mjs
          node --test-reporter=tap scripts/no-retry-bump.test.mjs "$BASE_SHA"
          echo "Phase 88.6.2 proofs passed: comment-only diff, anchor cites, cite ratchet, no retry bump."

  # DECISION Phase 88-32 ruling 5 (DEF-88-29-03): the drift-gate registry is its OWN JOB,
  # required in branch protection — over staying a step inside `quality`, and over a
  # CODEOWNERS rule. The turtle this closes: a commit deleting the registry step AND its
  # fixture suite left CI green, because `quality` reports green without them. As a job
  # named in the repo's required-checks list (repo SETTINGS, not the tree), deleting the
  # job leaves a required check unreported and the PR cannot merge — no commit can disarm
  # it. CODEOWNERS was verified dead for this repo: one collaborator, owner-authored PRs,
  # and GitHub never counts the author's own approval, so enforcement would deadlock every
  # ci.yml-touching PR. Moving the step back inside `quality` is a decision, not a cleanup.
  # ARMING: after the Phase 88 PR merges, add `drift-gate-registry` to the required checks
  # beside quality+e2e (recorded in the 88-32 close-out checklist).
  drift-gate-registry:
    name: drift-gate-registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Drift-gate registry — Phase 88's source-scan guards must exist and stay armed"
        # DECISION Phase 88.6.2-26 (D-12): one shared .mjs manifest read by a dependency-free node runner IN THIS REQUIRED JOB, chosen OVER keeping the rows here with a wider fixture parser (the self-check would live in quality, so deleting the fixture test turned it off) and OVER deriving the list from the import graph (a deleted gate drops out of a derived list: no deletion guard). No npm ci: builtins only, so a required check never waits on the registry or installs anything. The vitest lockstep pins these lines but does not re-run the tree check, so a manifest mutation reds this job alone. Moving the rows back into ci.yml is a decision, not a cleanup.
        #
        # WHY THIS STEP EXISTS AT ALL (Phase 88 plan 29).
        #
        # Phase 88 recorded FOURTEEN defective grep gates across its own plans
        # (DEF-88-16-01, DEF-88-19-01, DEF-88-21-01, DEF-88-24-04 x2, DEF-88-25-02 x3,
        # DEF-88-26, DEF-88-27-01, DEF-88-28-01 x3). Every one was a `grep` matching a
        # multi-token attribute against JSX, or matching a token it could not tell from a
        # lookalike, or counting a SUPERSET of the population the plan cared about. The
        # phase's answer was to replace them with source-scan TESTS, and DEF-88-21-01 asked
        # 88-29 to do "one pass over the whole gate set rather than three separate fixes".
        #
        # That pass moved the phase's drift gates into vitest — which opened a NEW hole this
        # step closes. `npx vitest run` above is green whether a suite passes or whether the
        # file was DELETED. A guard you can disarm with `rm` is not a guard. Nothing else in
        # this pipeline notices a missing test file.
        #
        # WHAT IT CLAIMS, AND WHAT IT DOES NOT.
        # It claims each guard still EXISTS and has not been gutted to a stub, and (since
        # Phase 88.6.2-26) that every file under src and e2e which imports the shared scanner
        # src/test-utils/sourceScan.ts is registered: a gates row with a floor, or a helperOnly
        # row with a reason. A new scan gate shipped unregistered reds this job, as does a
        # registered file that was deleted or gutted. It does NOT claim the assertions inside
        # are the right ones — every suite carries its own anti-vacuity guards for that, and
        # duplicating them here would be a second copy to drift. Stating the limit is part of
        # the point: a gate that overclaims is how this phase got fourteen of them.
        #
        # The counts are per-FILE and are FLOORS set at the current count. Per-file rather
        # than a total, deliberately: a single "there are >= 100 guard assertions" number is
        # DEF-88-28-01's threshold-on-a-superset defect exactly — deleting a whole suite
        # would pass if another grew. Adding a test to a suite is never a red build; removing
        # one is, and that is the intended asymmetry.
        #
        # WHERE THE ROWS LIVE. The rows, their floors and every amendment note that once sat
        # here live in scripts/drift-gate-registry.manifest.mjs, read by the runner
        # scripts/drift-gate-registry.mjs in this step and by the lockstep self-test
        # src/lib/ci-grep-gate.fixture.test.ts in quality, which also pins this job's lines.
        # The self-test runs first, so a broken runner never vouches for the tree.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/drift-gate-registry.mjs --self-test
          node scripts/drift-gate-registry.mjs

  e2e:
    name: e2e
    needs: quality # D-02: e2e only runs after the fast quality gate is green
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a healthy run is ~10 min; a hung step burned an hour once (run 27309008729)

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: boardgame_db
        ports:
          - 5432:5432
        # Health-gate the container so DB steps never race the server coming up.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DB connection — both forms, so create-database.js (DB_* vars) and
      # the sequelize-cli migrate path + runtime (DATABASE_URL) agree on the
      # same Postgres service container.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: boardgame_db
      DATABASE_URL: postgres://postgres:password@localhost:5432/boardgame_db
      # Backend boot env (minimal — optional integrations degrade gracefully, Pitfall 5).
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      FRONTEND_URL: http://localhost:3000
      # Signs availability magic JWTs + RSVP HMAC links (services/magicTokenService,
      # routes/rsvp.js). Throwaway CI-only value — must merely AGREE between the
      # fixture-minting step and the booted server, so plaintext is fine.
      MAGIC_TOKEN_SECRET: e2e-ci-throwaway-magic-token-secret-1f2e3d4c5b6a

    steps:
      - name: Checkout frontend (nextgamenight-frontend — repo root = FE app)
        uses: actions/checkout@v4

      - name: "Checkout backend (cross-repo: nextgamenight-backend)"
        uses: actions/checkout@v4
        with:
          repository: chrismcclarin/nextgamenight-backend
          path: backend # BE app then lives at backend/Sonnet/
          # workflow_dispatch can point the e2e job at a pre-merge backend branch
          # (phase 87.1 review HIGH-2); PR/push runs keep checking out main.
          ref: ${{ github.event.inputs.backend-ref || 'main' }}
          # nextgamenight-backend is PUBLIC (verified 2026-05-30) — no token needed;
          # actions/checkout reads public repos with the default GITHUB_TOKEN.

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/Sonnet/package-lock.json

      # ---- Backend: install, provision DB from the models, boot ----
      - name: Backend — install
        working-directory: backend/Sonnet
        run: npm ci

      - name: Backend — create database
        working-directory: backend/Sonnet
        run: npm run db:create

      # NO migrate step: the repo's migrations evolve the pre-existing prod
      # schema and cannot run from an empty DB (the earliest one assumes the
      # "Users" table already exists — proven by CI run 27304799255). Schema
      # comes from the models instead: the seed script runs
      # sequelize.sync({ alter: true }) and server boot syncs again (force:false).
      - name: Backend — seed (sync({alter:true}) builds the schema from models; seed data belongs to the E2E login identity)
        working-directory: backend/Sonnet
        env:
          AUTH0_ALICE_SUB: ${{ secrets.AUTH0_ALICE_SUB }} # the test user's `sub`
        run: npm run seed

      - name: Backend — mint E2E fixtures (journey tokens + ids -> GITHUB_ENV)
        working-directory: backend/Sonnet
        timeout-minutes: 5
        env:
          AUTH0_ALICE_SUB: ${{ secrets.AUTH0_ALICE_SUB }}
        run: |
          # Sequelize logs SQL to stdout — fish out the single marker line.
          # Output goes to a file (NOT the log) so tokens never print (T-82-11).
          #
          # Phase 88.3 plan 12 (threat T-88.3-60): both diagnostic tails below are piped
          # through a `sed` that replaces the `E2E_FIXTURES_JSON=...` MARKER LINE with
          # `<redacted>` before anything reaches the job log. Without it, a failure that
          # happens AFTER the marker is emitted printed that line verbatim into a PUBLIC
          # Actions log — and it carries live secrets (`availability_token`, the restore
          # nonce). SCOPE, stated precisely so it is not over-read: this redacts THAT LINE
          # and only that line. It is NOT a blanket guarantee that no diagnostic path in
          # the fixture script can ever print a secret; plan 02 separately narrows the
          # script's own `catch` to log `err.name`/`err.message` instead of the whole
          # error object, which closes the remaining Sequelize error-object path at its
          # origin, backend-side.
          #
          # AMENDED by CR-05 (88.3-cr, code-adversarial-review 2026-08-27): the tail also
          # drops every line beginning with `Executing (` — Sequelize's query log. Until
          # now those lines never reached the tail, but only as a SIDE EFFECT of the
          # backend's logger branch selection: CI sets DATABASE_URL (below), which picks
          # `config/database.js`'s URL branch, whose custom logger drops any message
          # containing SELECT/INSERT/UPDATE/DELETE. The DB_* branch in the same file logs
          # with a bare `console.log`, and CI ALSO sets DB_HOST/DB_NAME/DB_USER — so a
          # config move that dropped DATABASE_URL would start printing the fixture's
          # `bulkCreate` INSERTs, with their single-use token nonces inlined, straight
          # into a public Actions log. Bounded (MAGIC_TOKEN_SECRET here is a published
          # throwaway against an ephemeral CI database), but the redaction must not depend
          # on a decision made in another repo. It is now independent of it.
          node scripts/e2e-fixtures.js > /tmp/e2e-fixtures.out 2>&1 || { tail -40 /tmp/e2e-fixtures.out | sed -e 's/^E2E_FIXTURES_JSON=.*/E2E_FIXTURES_JSON=<redacted>/' -e '/^Executing (/d'; exit 1; }
          JSON=$(grep -m1 '^E2E_FIXTURES_JSON=' /tmp/e2e-fixtures.out | sed 's/^E2E_FIXTURES_JSON=//')
          [ -n "$JSON" ] || { echo "::error::e2e-fixtures emitted no marker line"; tail -40 /tmp/e2e-fixtures.out | sed -e 's/^E2E_FIXTURES_JSON=.*/E2E_FIXTURES_JSON=<redacted>/' -e '/^Executing (/d'; exit 1; }
          {
            echo "E2E_GROUP_ID=$(echo "$JSON" | jq -r .group_id)"
            echo "E2E_AVAILABILITY_TOKEN=$(echo "$JSON" | jq -r .availability_token)"
            echo "E2E_RSVP_PATH=$(echo "$JSON" | jq -r .rsvp_path)"
            echo "E2E_INVITE_GROUP_NAME=$(echo "$JSON" | jq -r .invite_group_name)"
            echo "E2E_INVITE_FRIEND_NAME=$(echo "$JSON" | jq -r .invite_friend_name)"
            # Phase 87.8 plan 09 (D-08 prep, ML-18/ML-22): the three keys plan 02 added are
            # extracted with `jq -e`, which exits non-zero when a key is absent or null. Bare
            # `jq -r` would emit the LITERAL STRING "null" — truthy and non-empty, so it
            # satisfies the specs' `?? fallback` idiom exactly when the guard is needed and
            # silently drives a spec to /null instead of failing this step loudly. Error
            # lines go to stderr (>&2): stdout inside this brace group is redirected into
            # GITHUB_ENV, not the job log. This guard doubles as the PRE-ARM GATE assertion —
            # see the decision block above the Playwright run step below.
            E2E_INVITE_FRIEND_NAME_PHONE=$(echo "$JSON" | jq -e -r '.invite_friend_name_phone') \
              || { echo "::error::fixture key invite_friend_name_phone missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            E2E_RSVP_PATH_PHONE=$(echo "$JSON" | jq -e -r '.rsvp_path_phone') \
              || { echo "::error::fixture key rsvp_path_phone missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            E2E_RESTORE_PATH=$(echo "$JSON" | jq -e -r '.restore_path') \
              || { echo "::error::fixture key restore_path missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            E2E_EVENT_DETAIL_PATH=$(echo "$JSON" | jq -e -r '.event_detail_path') \
              || { echo "::error::fixture key event_detail_path missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            # DECISION Phase 88.3 (OQ-1): this key is minted by the BACKEND repo, at
            # `periodictabletopbackend_v2/Sonnet/scripts/e2e-fixtures.js`, and THAT PR MERGES
            # FIRST. `jq -e` exits non-zero on a missing or null key, so if this line reaches a
            # ref whose `backend-ref` resolves to a backend that does not yet emit
            # `coloured_group_id`, the whole `e2e` job reds HERE, at the fixture step, before a
            # single Playwright assertion runs. That is deliberate — it fails loudly instead of
            # passing the literal string "null" into `E2E_COLOURED_GROUP_ID` and driving Req
            # 9(ii)'s probe to `/groupHomePage?id=null`, where it would fail for the wrong
            # reason. REJECTED: mutating the shared `Weekend Warriors` fixture group from inside
            # the spec (it is reused by `create-event`, `padding-budget` and `touch-targets`, and
            # a failed restore poisons every later run), and narrowing Req 9's acceptance to
            # vitest maths plus the unset group only (a gate that cannot red). Reordering the two
            # merges, or softening this to a bare `jq -r`, is a decision, not a cleanup.
            E2E_COLOURED_GROUP_ID=$(echo "$JSON" | jq -e -r '.coloured_group_id') \
              || { echo "::error::fixture key coloured_group_id missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            # DECISION Phase 88.3.1-W (PLAN-REVIEW Defect 5, owner-ruled 2026-08-30): a SECOND
            # guarded key, for a SECOND fixture group — chosen OVER reusing
            # `coloured_group_id`. That group DUAL-WRITES the preset id and the legacy Navy
            # hex, deliberately (it is what keeps frontend `main` green through the expand
            # window), so a probe pointed at it renders a colour whether or not this frontend
            # ever reads `color_preset` — i.e. the cross-repo proof passed identically on the
            # correct path and the broken one. `e2e-preset-only-group` carries the preset with
            # `background_color` NULL, so contrast.spec.ts's two AMENDMENT W tests red the
            # moment a `background_color`-only read site comes back. Same `jq -e` reasoning as
            # every key above: a bare `jq -r` emits the literal string "null", which satisfies
            # the spec's `?? fallback` idiom exactly when the guard is needed. REJECTED:
            # dropping the hex from `e2e-coloured-group` so one group could serve both roles —
            # that breaks `main`'s e2e before the frontend PR opens (RESEARCH Pitfall 3).
            E2E_PRESET_ONLY_GROUP_ID=$(echo "$JSON" | jq -e -r '.preset_only_group_id') \
              || { echo "::error::fixture key preset_only_group_id missing or null in E2E_FIXTURES_JSON" >&2; exit 1; }
            echo "E2E_INVITE_FRIEND_NAME_PHONE=$E2E_INVITE_FRIEND_NAME_PHONE"
            echo "E2E_RSVP_PATH_PHONE=$E2E_RSVP_PATH_PHONE"
            echo "E2E_RESTORE_PATH=$E2E_RESTORE_PATH"
            echo "E2E_EVENT_DETAIL_PATH=$E2E_EVENT_DETAIL_PATH"
            echo "E2E_COLOURED_GROUP_ID=$E2E_COLOURED_GROUP_ID"
            echo "E2E_PRESET_ONLY_GROUP_ID=$E2E_PRESET_ONLY_GROUP_ID"
          } >> "$GITHUB_ENV"
          echo "Fixtures minted (group id, availability token, rsvp path + phone rsvp path, invite group + friend, phone invite friend, restore path, event detail path, coloured group, preset-only group)."

      - name: Backend — boot (server.js, :4000) and smoke-wait /health
        working-directory: backend/Sonnet
        run: |
          npm start &
          npx --yes wait-on http://localhost:4000/health --timeout 60000

      # ---- Frontend: install, production build + start, then Playwright ----
      - name: Frontend — install
        run: npm ci

      - name: Frontend — production build (proves the green build, SC#1 / Open Q3)
        run: npm run build

      - name: "CSS bundle guard — two-sided emitted-CSS assertion (Req 19)"
        # Phase 88 plan 29. The durable replacement for 87.7's one-shot migration tools,
        # which `.planning/deferred/phase-88.md` § "Durable CSS-bundle guard" records as
        # "wired into nothing". `scripts/tw4-css-diff.mjs` cannot be the gate — its own
        # header says it "always exits 0 and the human reading it is the gate".
        #
        # Placed HERE, in the e2e job immediately after its existing production build,
        # chosen OVER adding a build to the `quality` job. The assertion needs emitted CSS,
        # and `quality` is the deliberately fast lane (lint + tsc + vitest, no build);
        # adding a ~90s Next build to it to run a 20ms check would slow every PR's first
        # signal. e2e `needs: quality` and runs on every PR, so the guard still gates the
        # merge. Moving it into `quality` means paying for a second build — that is a
        # decision, not a cleanup.
        #
        # Both directions are load-bearing. Direction A alone (no fixture CSS in the bundle)
        # is satisfied by a build that emits NOTHING, which would be a totally unstyled site
        # waved through by its own guard — the "gate that cannot red" failure this phase
        # recorded fourteen times. See the script for the sentinel's placement rationale and
        # for why each required utility is pinned to the `@source` glob that is the only
        # thing keeping it in the bundle.
        #
        # PROVEN, not assumed — four real builds, recorded in 88-29-SUMMARY.md:
        #   remove `@source not '../lib/**/*.test.*'`   -> RED (direction A)
        #   remove `source(none)`                        -> RED (direction A)
        #   remove `@source './**'`      (app glob)      -> RED (direction B)
        #   remove `@source '../components/**'`          -> RED (direction B)
        #   restored                                     -> GREEN, both directions
        #
        # The post-88 baseline (DI-87.7-22: all chunks concatenated, sorted) lives at
        # `scripts/baselines/post-88.css` and is regenerated with
        # `node scripts/css-bundle-guard.mjs --write-baseline` after a build. It is
        # deliberately NOT asserted here: a design change would then red every PR, and a
        # gate people routinely refresh to make green is worse than no gate. It exists so a
        # future phase diffs against Phase 88's design system rather than v3's.
        run: node scripts/css-bundle-guard.mjs

      - name: Frontend — start (next start, :3000) and wait
        env:
          # Full @auth0/nextjs-auth0 server env — the Playwright setup project
          # drives the real /api/auth/login route, so the Next server must be
          # able to complete the Auth0 code exchange (T-82-11: secrets cross
          # only via env, never echoed).
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }} # cookie-encryption key, CI-only random value
          AUTH0_BASE_URL: http://localhost:3000
          AUTH0_ISSUER_BASE_URL: https://${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # DECISION Phase 88.6.2-27 (D-19): age installed ONCE, here, before the tests, chosen OVER an
      # install inside each encrypt step (the always() month-tile step would run apt after a green
      # run and a failing run would install twice). Fail closed holds: if this step fails the tests
      # never run and the encrypt steps find no input; scripts/encrypt-evidence.sh exits on 'no
      # input' before its age check. Two apt lines, not &&: under set -e a failing non-final &&
      # member does not stop the script. Moving the install back into the encrypt steps is a
      # decision, not a cleanup. No `if:`, no `||`, no continue-on-error: an install failure reds
      # the job (T-88.6-G34; lockstep-pinned by src/lib/ci-grep-gate.fixture.test.ts).
      - name: Install age (evidence encryption — T-88.6-G34)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age

      # DECISION Phase 88.6.2 code review (B-ML1, B-ML3): the encrypt script's 14-case --self-test
      # and its P3 node test run here, once, directly after age is installed and before the tests,
      # chosen OVER leaving them to a local run. The real encrypt steps pass whether or not the
      # zip and error-context.md exclusions, the --match filter or the fail-closed trap still
      # work, so without this step a broken exclusion keeps every required check green. Placed
      # before the tests so a broken checker reds the job before it vouches for any evidence.
      # The env prefix keeps this line out of the encrypt-invocation reader in
      # src/lib/ci-grep-gate.fixture.test.ts, which pairs every real invocation with an upload.
      # No `if:`, no `||`, no continue-on-error (lockstep-pinned by that same file).
      - name: Self-test the evidence encryption (encrypt-evidence.sh --self-test and its P3 test)
        shell: bash
        run: |
          set -euo pipefail
          AGE_BIN=age AGE_KEYGEN_BIN=age-keygen bash scripts/encrypt-evidence.sh --self-test
          node --test --test-reporter=tap scripts/encrypt-evidence.test.mjs

      # DECISION Phase 87.7 D-13/D-15: the PR lane is pinned with `--project`, chosen OVER a
      # separate report-only / continue-on-error mobile job. The rejected pattern is the exact
      # one Phase 88.4 structurally BANNED in the backend repo (`verify-gate-armed.js` fails CI
      # on that key) — it must not be reintroduced in this repo in any future wiring, INCLUDING
      # by Phase 87.8 when it arms the phone project. A gate that cannot fail is not a gate.
      #
      # `--project` is a positive ALLOWLIST and that is the load-bearing property: adding a
      # project to playwright.config.ts can never silently opt it into the PR lane. The `phone`
      # project (MOB-03) therefore exists in config but does not run here yet.
      #
      # DECISION Phase 87.8 plan 09 (ML-26): this plan wires the phone fixture keys (the
      # guarded `jq -e` extraction in the fixture step above) and the pre-arm gate below, and
      # deliberately does NOT arm the lane — arming before the combined-run evidence exists
      # would fail PRs for a reason unrelated to mobile. Plan 12 ALONE performs the arming
      # edit (appending the phone project to the run line below), immediately after its green
      # combined run and negative control. The D-13 accepted window — the phone surface
      # unwatched on PRs — is still OPEN until plan 12 lands that edit; this plan is the last
      # preparatory step before it closes.
      #
      # PRE-ARM GATE (plan 09, ML-20/ML-23) — plan 12 MUST NOT arm until this is green:
      # dispatch THIS workflow (workflow_dispatch, from a ref carrying the guarded `jq -e`
      # extraction above) with `backend-ref` pointing at the backend commit that put plan 02's
      # fixture keys on backend main. The guarded extraction hard-fails the fixture step on
      # any missing/null key, so a green fixture step in that dispatched run IS the mechanical
      # proof that the CI backend checkout emits every key non-null — replacing the
      # prose-only merge-order promise. Same workflow_dispatch backend-ref pattern as Phase
      # 87.1 (run 28946718108), reused in 87.3.
      #
      # ML-16 OWNER RULING (severity LOW, 2026-08-02, 87.8-PLAN-REVIEW.md): plan 12's
      # deliberately-red negative control uploads Playwright traces carrying fixture URLs and
      # the encrypted appSession cookie — a trace is a different container from the `.auth/`
      # exclusion in the artifact step below. Accepted CONDITIONAL on three invariants; if
      # ANY flips, this returns to at least MEDIUM and must be re-ruled, not inherited:
      # (1) MAGIC_TOKEN_SECRET stays a published throwaway paired with an ephemeral CI
      # database; (2) AUTH0_SECRET stays CI-only and un-reused anywhere durable;
      # (3) FRONTEND_URL stays localhost in CI.
      #
      # Also deliberately NOT done (D-19): no workflow_dispatch input for project selection. A
      # permanent input defaulting to the pinned set is a config surface that can silently
      # disarm this pinning — the same failure class Phase 88.4 spent a plan closing. The one
      # exploratory all-projects run uses a throwaway branch instead. FULL MECHANISM — the
      # push alone is NOT enough: the `push: branches-ignore: [main]` trigger above picks the
      # branch up, but this pinned `--project` list applies to EVERY trigger, so the throwaway
      # branch must ALSO edit the run line below (append a project, or drop the pin entirely
      # for all-projects). Both edits die with the branch; nothing permanent changes.
      #
      # ARMED Phase 87.8 plan 12 step (c): `--project=phone` joined the pinned set AFTER the
      # required evidence pair — green combined run 30844453508 (44 passed, 0 failed) and
      # negative control 30844455459 (red on exactly the five planted padding assertions).
      # Removing `--project=phone` from the run line DISARMS the phone-forward gate (MOB-03) —
      # that is a decision, not a cleanup.
      #
      # DECISION Phase 88.6-61 (review round 2 H-5, owner ruling R2-H5-RULING "source-level",
      # 2026-09-29). The e2e step below runs TWO invocations, setup first, and the login project
      # takes no page capture of any kind (playwright.config.ts). WHY: on any failed test
      # Playwright 1.60 writes `error-context.md` with an aria snapshot that serialises typed
      # input values, so a login failing after the password fill wrote E2E_AUTH0_PASS into
      # test-results/ — which the failure upload below publishes from a PUBLIC repo.
      # - PLAYWRIGHT_NO_COPY_PROMPT=1 sits on the setup COMMAND only, chosen OVER the step's
      #   `env:` (process-wide — journeys/phone would lose their failure snapshot too). It is an
      #   undocumented internal whose only reader is `@playwright/test` 1.60
      #   playwright/lib/index.js:624, so it is NOT the structural arm: the `error-context.md`
      #   exclusion on the upload is.
      # [AMENDED 2026-10-24 — Phase 88.6.2-27: the error-context.md exclusion now lives in scripts/encrypt-evidence.sh, run by the encrypt step before the upload; the upload ships age ciphertext only.]
      # - `--no-deps` on the journeys+phone invocation is LOAD-BEARING: without it Playwright
      #   re-runs `setup` as a dependency of both projects, WITHOUT the env var, and logs in twice.
      #   The storageState the first invocation wrote under .auth/ carries over on disk.
      # - The setup invocation writes NO json report: a CLI `--reporter=github` REPLACES the
      #   config's reporter list (`@playwright/test` 1.60 playwright/lib/common/index.js:576), so
      #   the Gate C and D10 floors below read the journeys+phone report only. Chosen OVER
      #   `PLAYWRIGHT_JSON_OUTPUT_NAME` (ignored while the config sets `outputFile`,
      #   playwright/lib/runner/index.js:1483-1495) and OVER merging the two reports (no step
      #   reads setup results).
      # - The second invocation clears test-results/ at start (playwright/lib/runner/index.js:
      #   5919-5938). Harmless: bash -e stops the step after a failed setup, so a setup failure's
      #   evidence is never cleared — the same stop the single invocation's dependency skip gave.
      # Folding the two invocations back into one, or moving the env var into `env:`, is a
      # decision, not a cleanup. Lockstep-pinned by src/lib/ci-grep-gate.fixture.test.ts
      # ("88.6 R2-H5").
      - name: Run Playwright journeys (setup logs in once; all specs in the journeys project reuse storageState)
        env:
          # Auth credentials cross into the runner ONLY via env — never echoed (T-82-11).
          E2E_AUTH0_USER: ${{ secrets.E2E_AUTH0_USER }}
          E2E_AUTH0_PASS: ${{ secrets.E2E_AUTH0_PASS }}
        run: |
          PLAYWRIGHT_NO_COPY_PROMPT=1 npx playwright test --project=setup --reporter=github
          npx playwright test --project=journeys --project=phone --no-deps

      # Phase 88.3-cr, CR-09: the pinned `--project=phone` above is what makes Gate C
      # RUN, and the lockstep test in `src/lib/ci-grep-gate.fixture.test.ts` is what
      # keeps that flag on the line. Neither can tell you the tests actually executed.
      # Every Gate C test sits behind `test.skip(({ isMobile }) => !isMobile)`, and
      # Playwright exits 0 on a run that skipped all of them — run 33138624128 reported
      # "85 passed, 72 skipped" with nothing consuming the second number. Removing
      # `isMobile: true` from the phone project, or inverting that predicate, silently
      # zeroes the phase's ONLY rendered-pixel contrast gate while this job stays green.
      # This step is the consumer. It reads the json reporter's output (see
      # playwright.config.ts) and fails if fewer than the floor executed and passed.
      # It runs on EVERY trigger this job runs on, workflow_dispatch included — there is
      # no `if:` here on purpose, and adding one would exempt exactly the dispatch lane
      # the phase's cross-repo merge-order proof depends on.
      - name: Gate C executed-count floor — contrast.spec.ts must actually run in the phone project
        run: node scripts/gate-c-executed-floor.mjs playwright-results.json

      # Phase 88.6 plan 55 (owner-ruled 2026-09-28, NEW OWNER ITEM 4): the SAME hole as Gate C,
      # mirrored. touch-targets.spec.ts's D10 arm (gated hover, focus ring, hover pin) sits behind
      # `test.skip(({ isMobile }) => isMobile)` so it runs ONLY in the desktop `journeys` project;
      # removing the project from the run line, flipping `isMobile` on it, or inverting that skip
      # zeroes the arm while this job stays green. Same script, generalised by flags, not copied.
      # The floor is the `--list` count (`npx playwright test --list --project=journeys
      # e2e/touch-targets.spec.ts -g "D10"` = 3 on 2026-09-28), never above it. Closes WINDOWS 20
      # and ledger row R104 (88.6-46-SUMMARY.md). No `if:`, for the reason the step above gives.
      - name: D10 executed-count floor — touch-targets.spec.ts's D10 arm must actually run in the journeys project
        run: node scripts/gate-c-executed-floor.mjs playwright-results.json --spec e2e/touch-targets.spec.ts --project journeys --title-prefix D10 --floor 3

      - name: Executed-count floors — every e2e spec with a conditional skip must actually run in its project
        # DECISION Phase 88.6.2-26 (gate-c): one step reading scripts/gate-c-floors.manifest.mjs, chosen
        # OVER one step per spec (the 88.6-55 flags stay for Gate C and D10). Phase 88.6.2-26 (SPEC R8,
        # register row 64): Gate C and D10 were the only two of the 51 specs that call test.skip,
        # test.fixme, describe.skip or describe.fixme to have an executed floor; for the other 50 a
        # flipped isMobile predicate or a dropped --project zeroed them with this job green. Each
        # entry is a spec + project and its measured executed count (never above its --list count);
        # the script reds NOT COLLECTED, ABOVE LISTED or DISARMED, collected before one exit. Spec
        # matching is on a path boundary. The lockstep tests in src/lib/ci-grep-gate.fixture.test.ts
        # pin this run line, the entry shape and the population. No `if:`, for Gate C's reason above.
        run: node scripts/gate-c-executed-floor.mjs playwright-results.json --config scripts/gate-c-floors.manifest.mjs

      # DECISION Phase 88.6.2-27 (D-17): tar piped straight into age with no plaintext copy,
      # exclusions as find predicates AND tar --exclude, fail closed (any failure leaves nothing to
      # upload), chosen OVER a plaintext fallback, OVER per-step inline copies (two exclusion lists
      # drift) and OVER a passphrase in a GitHub secret (P3). Changing this is a decision, not a
      # cleanup. The FE repo is PUBLIC and the phone project is authenticated, so a failure
      # screenshot is a logged-in page: the encrypt step below packs the evidence into
      # enc/playwright-report/playwright-report.tar.age, encrypted to .github/evidence-recipient.txt,
      # and the upload after it ships only that directory. If tar, age or the script's post-check
      # fails, the step fails, its EXIT trap removes enc/playwright-report/, and the upload finds
      # nothing (if-no-files-found: ignore). Decrypt recipe: README.md, section "## CI".
      # The CI reporter is 'github' (no playwright-report/ dir) — failure
      # evidence (screenshots, error-context.md) lands in test-results/.
      # NOT .auth/ — never upload the appSession storageState.
      # 88.6 CR-01: NO zip archives either. A Playwright trace.zip records
      # every action's parameters in plain text, and a retried login journey
      # would carry the typed E2E_AUTH0_PASS. The setup project now records
      # no trace (playwright.config.ts) — this exclusion is the independent
      # second arm for the TRACE channel.
      # 88.6-61 (review round 2 H-5): NO error-context.md either. Its aria
      # snapshot serialises typed input values (the password included), and
      # trace settings never reached it — CR-01's "cannot leave a PUBLIC repo"
      # was false for that channel until this exclusion. With BOTH exclusions,
      # neither a trace nor a page snapshot can leave a PUBLIC repo. The
      # journeys/phone error-context.md is excluded too (the error text stays in
      # the CI log), chosen OVER a setup-directory-only glob: Playwright derives
      # that directory name from the test title, so a rename silently stops a
      # per-directory glob matching. The exclusions are tar --exclude arguments
      # and find predicates inside scripts/encrypt-evidence.sh, applied to every
      # input. Lockstep-pinned by
      # src/lib/ci-grep-gate.fixture.test.ts ("88.6 CR-01", "88.6 R2-H5").
      - name: Encrypt Playwright failure evidence (age, fail closed — T-88.6-G34)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/encrypt-evidence.sh --name playwright-report --recipients .github/evidence-recipient.txt -- playwright-report/ test-results/

      - name: Upload Playwright failure evidence (age ciphertext only — never .auth/ — T-82-12)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: enc/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # Phase 88.6 plan 55 (NEW OWNER ITEM 4, ledger R140): `always()` because the month-tile
      # screenshots are review evidence on a GREEN run, which `failure()` above never uploads.
      # Since Phase 88.6.2-27 the PNG-only filter is the encrypt step's --match (a basename glob
      # under test-results/), so it cannot reach `.auth/user.json` (repo root) or
      # playwright-results.json (repo root), and the upload ships only the age ciphertext in
      # enc/month-tile-desktop-screenshots/ — pinned in src/lib/ci-grep-gate.fixture.test.ts.
      - name: Encrypt desktop month-tile screenshots (always — age, fail closed — T-88.6-G34)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/encrypt-evidence.sh --name month-tile-desktop-screenshots --recipients .github/evidence-recipient.txt --match 'month-tile-desktop-*.png' -- test-results/

      - name: Upload desktop month-tile screenshots (always — age ciphertext only, never .auth/ — T-82-12)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: month-tile-desktop-screenshots
          path: enc/month-tile-desktop-screenshots/
          retention-days: 7
          if-no-files-found: warn
